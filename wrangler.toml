name = "calendarioeventos"
main = "worker/index.js"
compatibility_date = "2026-11-11"

# Cloudflare publica el contenido de public/ en el mismo dominio del Worker.
# Las rutas /api/* se ejecutan primero en worker/index.js.
# Cualquier otra ruta inexistente devuelve public/index.html para conservar
# la navegación de la SPA (por ejemplo /plan/42, /calendar o /profile).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

# D1 debe enlazarse con el binding DB antes de desplegar.
# Ejecuta `npm run configure:d1` para localizar automáticamente la base
# `planes-con-alma` de la cuenta autenticada y escribir aquí su database_id.
# Si la base tiene otro nombre: npm run configure:d1 -- nombre-de-la-base
